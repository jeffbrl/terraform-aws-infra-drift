name: OpenTofu Drift Detection

on:
  schedule:
    # Daily at 08:00 UTC
    - cron: '0 8 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-2' }}
  TF_VAR_aws_region: ${{ vars.AWS_REGION || 'us-east-2' }}

concurrency:
  group: opentofu-${{ github.ref }}
  cancel-in-progress: false

jobs:
  drift:
    name: Detect AWS Config Drift
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY || secrets.AWS_SECRET_ACCESS }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v1

      - name: OpenTofu Init
        run: tofu init -no-color

      - name: OpenTofu Refresh-Only Plan
        id: plan
        run: |
          set +e
          tofu plan -refresh-only -detailed-exitcode -no-color -out=drift.tfplan > plan-output.txt 2>&1
          EXIT_CODE=$?
          set -e

          cat plan-output.txt
          echo "exit_code=$EXIT_CODE" >> "$GITHUB_OUTPUT"

          if [ "$EXIT_CODE" -eq 2 ]; then
            tofu show -no-color drift.tfplan > drift-plan.txt
            tofu show -json drift.tfplan > drift-plan.json
          fi

      - name: Upload Drift Plan Artifacts
        if: steps.plan.outputs.exit_code == '2'
        uses: actions/upload-artifact@v4
        with:
          name: drift-plan-${{ github.run_id }}
          path: |
            drift-plan.txt
            drift-plan.json
          retention-days: 14

      - name: Open or Update Drift Issue
        if: steps.plan.outputs.exit_code == '2'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('drift-plan.txt', 'utf8');
            const maxLen = 60000;
            const truncated = plan.length > maxLen ? plan.slice(0, maxLen) + '\n... (truncated, see workflow artifacts)' : plan;

            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              `OpenTofu detected infrastructure drift in \`${{ env.AWS_REGION }}\`.`,
              ``,
              `**Workflow Run:** ${runUrl}`,
              ``,
              `<details>`,
              `<summary>Refresh-only plan output</summary>`,
              ``,
              '```hcl',
              truncated,
              '```',
              ``,
              `</details>`,
            ].join('\n');

            const { data: issues } = await github.rest.issues.listForRepo({
              ...context.repo,
              state: 'open',
              labels: 'infra-drift',
              per_page: 10,
            });

            if (issues.length > 0) {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: issues[0].number,
                body,
              });
            } else {
              await github.rest.issues.create({
                ...context.repo,
                title: 'AWS Infrastructure Drift Detected',
                body,
                labels: ['infra-drift'],
              });
            }

      - name: Close Drift Issue When Clean
        if: steps.plan.outputs.exit_code == '0'
        uses: actions/github-script@v7
        with:
          script: |
            const { data: issues } = await github.rest.issues.listForRepo({
              ...context.repo,
              state: 'open',
              labels: 'infra-drift',
              per_page: 10,
            });

            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            for (const issue of issues) {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: issue.number,
                body: `No drift detected in latest run (${runUrl}). Closing issue.`,
              });
              await github.rest.issues.update({
                ...context.repo,
                issue_number: issue.number,
                state: 'closed',
              });
            }

      - name: Fail on Drift or Error
        if: steps.plan.outputs.exit_code != '0'
        run: |
          echo "Plan exited with code ${{ steps.plan.outputs.exit_code }}"
          exit "${{ steps.plan.outputs.exit_code }}"
